[package]
name = "callr"
version = "0.1.0"
description = "Callr — on-chain escrow and trust-minimized settlement for social prediction markets, settled via TxLINE Merkle proofs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "callr"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "=0.30.1"
anchor-spl = "=0.30.1"

# Pin transitive dependencies to versions compatible with Rust < 1.85
# (edition2024 requires Cargo 1.85+)
[dependencies.solana-program]
version = "=1.18.26"
